name: ad-media-gen
on: { push: { branches: [ad-media-gen], paths: ['gen/run.py', 'gen/prompts.json', '.github/workflows/gen.yml'] } }
permissions: { contents: write }
jobs:
  gen:
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { shots: ['e2_bed', 'e2_notice', 'e2_doorway', 'e2_lap', 'e2_pray', 'e2_move'] } }
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gradio_client && SHOTS=${{ matrix.shots }} python3 gen/run.py
      - run: |
          git config user.name "ad-media-gen"; git config user.email "noreply@anthropic.com"
          git checkout -b ad-img-${{ matrix.shots }} && git add gen/out2 && git commit -m "images ${{ matrix.shots }}" && git push -f origin ad-img-${{ matrix.shots }}
