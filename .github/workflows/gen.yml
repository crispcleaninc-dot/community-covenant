name: ep-holland-gen
on: { push: { branches: [ep-holland-gen] } }
permissions: { contents: write }
jobs:
  img:
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { shot: [s03, s20] } }
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gradio_client && SHOT=${{ matrix.shot }} python3 gen/img.py 2>&1 | tee img_err.txt; mkdir -p out; cp img_err.txt out/${{ matrix.shot }}_run.txt
      - if: always()
        run: |
          git config user.name "ep-holland-gen"; git config user.email "noreply@anthropic.com"
          git checkout -b ep-holland-img3-${{ matrix.shot }} && git add out && git commit -qm "img ${{ matrix.shot }}" && git push -f origin ep-holland-img3-${{ matrix.shot }}
