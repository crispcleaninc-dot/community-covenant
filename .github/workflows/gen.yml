name: safe-gen
on: { push: { branches: [safe-gen] } }
permissions: { contents: write }
jobs:
  img:
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, max-parallel: 20, matrix: { shot: [s23, s30, v1] } }
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gradio_client && SHOT=${{ matrix.shot }} python3 gen/img.py || true
      - if: always()
        run: |
          git config user.name "safe-gen"; git config user.email "noreply@anthropic.com"
          mkdir -p out; git checkout -b safe-img2-${{ matrix.shot }} && git add out && git commit -qm "img ${{ matrix.shot }}" && git push -f origin safe-img2-${{ matrix.shot }}
